; Supervisor programs for Snapsbrew without Docker: Horizon and the scheduler.
;
; 1. Replace www-data, /var/www/snapsbrew and /usr/bin/php with your values.
; 2. Copy this file to /etc/supervisor/conf.d/snapsbrew.conf.
; 3. Run: supervisorctl reread && supervisorctl update
;
; After each deploy, run `php artisan horizon:terminate`. Horizon stops after
; the current jobs, and Supervisor starts it again with the new code.
;
; The scheduler program replaces the cron entry of the docs. Use one, not both.

[program:snapsbrew-horizon]
command=/usr/bin/php /var/www/snapsbrew/artisan horizon
directory=/var/www/snapsbrew
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
; The longest job is a creative package item, with a timeout of 120 seconds.
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=/var/www/snapsbrew/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:snapsbrew-scheduler]
command=/usr/bin/php /var/www/snapsbrew/artisan schedule:work
directory=/var/www/snapsbrew
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/www/snapsbrew/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
