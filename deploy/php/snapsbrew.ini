; PHP settings for Snapsbrew without Docker. The Docker image needs no change.
;
; Copy this file to the conf.d folder of PHP-FPM, for example
; /etc/php/8.4/fpm/conf.d/99-snapsbrew.ini. Then restart PHP-FPM. The web
; requests read these limits. Horizon and the scheduler do not need them.

; A spreadsheet import and an image upload accept 10 MB. The PHP default is
; 2 MB. If the PHP limit is lower than 10 MB, a larger file never reaches the
; app, and the user reads "The file field is required."
upload_max_filesize = 20M
post_max_size = 20M

; The spreadsheet reader loads the whole file into memory. The Docker image
; uses 256 MB.
memory_limit = 256M
