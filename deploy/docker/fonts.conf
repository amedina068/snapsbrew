<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts for the renderer. The image installs Liberation, DejaVu, Noto and
  Noto Color Emoji. Fontconfig maps Arial, Helvetica, Times New Roman and
  Courier New to the metric-compatible Liberation fonts.

  Put more .ttf or .otf files in /data/fonts. Chromium reads them when it
  starts, so restart the container after you add a font.
-->
<fontconfig>
  <dir>/data/fonts</dir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>Noto Sans</family><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>Noto Serif</family><family>DejaVu Serif</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
