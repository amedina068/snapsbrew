# NGINX reverse proxy in front of the Snapsbrew Docker stack.
#
# The web container answers plain HTTP on 127.0.0.1:8080 (APP_PORT). This
# server block terminates TLS and sends the requests to that port.
#
# 1. Copy this file to /etc/nginx/sites-available/snapsbrew.conf.
# 2. Replace snapsbrew.example and the certificate paths with your values.
# 3. Link the file into /etc/nginx/sites-enabled/.
# 4. Run: nginx -t && systemctl reload nginx
# 5. Set TRUSTED_PROXIES in .env to the gateway address of the Docker network.
#    Find it with:
#    docker network inspect <project>_default --format '{{(index .IPAM.Config 0).Gateway}}'

server {
    listen 80;
    listen [::]:80;
    server_name snapsbrew.example;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name snapsbrew.example;

    ssl_certificate     /etc/letsencrypt/live/snapsbrew.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snapsbrew.example/privkey.pem;

    # A spreadsheet import and an image upload accept 10 MB.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # The app answers 400 to a host that is not the host of APP_URL.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A sync render waits for the renderer.
        proxy_read_timeout 100s;
    }
}
