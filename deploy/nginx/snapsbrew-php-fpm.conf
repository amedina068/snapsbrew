# NGINX server block for Snapsbrew without Docker (NGINX and PHP-FPM).
#
# 1. Copy this file to /etc/nginx/sites-available/snapsbrew.conf.
# 2. Replace snapsbrew.example, the certificate paths, /var/www/snapsbrew and
#    the PHP-FPM socket with your values.
# 3. Link the file into /etc/nginx/sites-enabled/.
# 4. Run: nginx -t && systemctl reload nginx
#
# Set TRUSTED_PROXIES only if another proxy sends requests to this server.
# This server block talks to PHP-FPM directly, so the app reads the client IP
# from the connection.

server {
    listen 80;
    listen [::]:80;
    server_name snapsbrew.example;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name snapsbrew.example;

    root /var/www/snapsbrew/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/snapsbrew.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snapsbrew.example/privkey.pem;

    # A spreadsheet import and an image upload accept 10 MB.
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # A sync render waits for the renderer. The Docker image uses 99 seconds.
        fastcgi_read_timeout 100s;
    }

    # The OAuth discovery documents of the MCP server are under /.well-known/.
    # The app serves them, so this rule must not block them.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
