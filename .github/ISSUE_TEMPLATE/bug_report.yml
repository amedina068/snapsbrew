name: Bug report
description: Report a problem in Snapsbrew.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Fill in each field, so that the maintainer can find the problem.

        Do not report a security problem here. Read SECURITY.md and report it in private.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, the image tag or the commit. For a Docker image, run `docker compose images web`. For a checkout, run `git rev-parse --short HEAD`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Docker image from GHCR (docker-compose.image.yml)
        - Docker Compose, built from source (docker-compose.yml)
        - Local install (php artisan serve, Valet, Herd or similar)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The operating system, the PHP version, the database and the renderer (browserless or browsershot).
      placeholder: Ubuntu 24.04, PHP 8.3, MySQL 8.4, browserless
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. Add a screenshot if the problem is visible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the related lines from `storage/logs/laravel.log` or from `docker compose logs web horizon`.
        Remove tokens, passwords, emails and signed URLs before you paste.
      render: shell
