  /v1/snaps:
    post:
      tags:
        - Snaps
      operationId: snaps_store
      summary: 'Create a snap'
      description: |-
        Renders a snap from a single template (`template_id`) or every template in a collection (`collection_id`). Provide exactly one of the two.

        Synchronous (default): the response carries the finished `media_url` and returns 201.

        Asynchronous (`async: true`): the snap is queued, the response returns 202 immediately, and the result is delivered to `webhook_url`. The webhook body is `{"event": ..., "snap": {...}}`. The event is `snap.completed` when the render succeeds, or `snap.failed` when it fails. A failed snap has `status: failed` and `last_error: render_failed`.

        The API always renders the template's **published** version. Unpublished draft edits are not visible to the API until the template is published.

        Gates: logApiRequest.

        Note: Every response carries an `X-Request-Uuid` header. Quote it in support tickets.

        Note: A collection request returns an array of snap objects, one per template.

        Note: A response to a repeated `idempotency_key` carries an `X-Idempotent-Replay: true` header and renders nothing.

        Note: `webhook_url` must be a public address. A host that resolves to a private, loopback, link-local or reserved range is rejected with 422.

        Note: Each webhook carries three headers: `X-Snapsbrew-Delivery` (one ID for all attempts of a delivery), `X-Snapsbrew-Timestamp` (Unix seconds) and `X-Snapsbrew-Signature`. The signature is the HMAC-SHA256 hex digest of `{timestamp}.{raw body}` with the webhook signing secret of your company (**Account > Developers**). Compare it in constant time, and reject a timestamp that is more than five minutes old.

        Note: An `idempotency_key` is honored for 24 hours. After that window a retry is a new request and renders a new snap.
      security:
        -
          bearerToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                template_id:
                  type: string
                  description: 'UUID of a single template to render. Rules: required_without:collection_id, prohibits:collection_id, exists templates.uuid scoped to company.'
                collection_id:
                  type: string
                  description: 'UUID of a collection; one snap is rendered per template. Rules: required_without:template_id, prohibits:template_id, exists template_collections.uuid scoped to company.'
                type:
                  type: string
                  description: 'Output type. Defaults to image. Rules: nullable, in:image,pdf.'
                format:
                  type: string
                  description: 'Image output format (image type only). Defaults to png. Rules: sometimes, in:png,jpeg,webp.'
                transparent:
                  type: boolean
                  description: 'Render on a transparent background. Valid for png and webp only; jpeg + transparent returns 422. Rules: sometimes, boolean; rejected with png-only/webp-only — 422 when combined with format=jpeg.'
                async:
                  type: boolean
                  description: 'Queue the render and return 202. Rules: sometimes, boolean.'
                webhook_url:
                  type: string
                  description: 'Callback URL invoked when an async snap completes. The address must be public. A host that resolves to a private, loopback, link-local or reserved range is rejected with 422. The callback does not follow a redirect. The app checks the address again when it sends the callback, and connects to the address that it checked. If delivery fails, `last_error` holds a code: `webhook_address_refused`, `webhook_redirect_refused`, `webhook_unreachable` or `webhook_http_<status>`. Rules: url, required_if:async,true, must be a public http or https address.'
                variants:
                  type: array
                  items:
                    $ref: '#/components/schemas/Variant'
                  description: 'Per-layer content overrides applied to the render. Each item is one Variant object: a layer key and one override. Rules: nullable, array; image_url must be a public http or https URL, background_color must be a CSS color, barcode_content max:1000.'
                idempotency_key:
                  type: string
                  description: 'Send the same key when you retry after a timeout. The retry returns the same snap and does not render it again. Keys are honored for 24 hours and are scoped to your account. Not supported with collection_id. Rules: sometimes, nullable, string, max:191, letters/digits/underscore/hyphen only, prohibits:collection_id.'
            example:
              template_id: '<uuid>'
              type: image
              variants:
                -
                  layer: review_title
                  text: 'Hello world'
      responses:
        201:
          description: 'Synchronous snap rendered. The body is the snap with no `data` wrapper. A collection request returns an array of snaps.'
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/Snap'
                  -
                    type: array
                    items:
                      $ref: '#/components/schemas/Snap'
              example:
                id: 9f1c2d3e
                media_url: 'https://app.example.com/storage/snaps/9f1c2d3e.png'
                width: 1200
                height: 630
                type: image
                status: completed
                is_async: false
                webhook_url: null
                completed_at: '2026-05-01T12:00:03Z'
                last_error: null
                variants: []
                template_id: 141e8454-8aa1-420a-bd0b-18a85ba949a2
                template_title: 'Launch card'
                created_at: '2026-05-01T12:00:00Z'
        202:
          description: 'Asynchronous snap queued. The body is the snap with no `data` wrapper. A collection request returns an array of snaps.'
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/Snap'
                  -
                    type: array
                    items:
                      $ref: '#/components/schemas/Snap'
              example:
                id: 9f1c2d3e
                media_url: ''
                width: 1200
                height: 630
                type: image
                status: pending
                is_async: true
                webhook_url: 'https://example.com/hooks/snap'
                completed_at: null
                last_error: null
                variants: []
                template_id: 141e8454-8aa1-420a-bd0b-18a85ba949a2
                template_title: 'Launch card'
                created_at: '2026-05-01T12:00:00Z'
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability, or a permission check refused the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This action is unauthorized.'
        404:
          description: 'The collection holds no templates.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "The collection doesn't have any templates."
        409:
          description: 'The idempotency_key cannot be used. Read `code`: `idempotency_key_in_progress` means another request holds the key, so retry with the same key. `idempotency_key_belongs_to_batch` means a batch owns the key, so send a new key. Nothing was created.'
          content:
            application/json:
              schema:
                type: object
