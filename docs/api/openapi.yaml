                  template_id:
                    - 'The template id field is required.'
        429:
          description: 'Rate limit exceeded. A preview allows 10 requests per minute for one user, inside the 60 per minute of the api group.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  /signed-url/image.jpg:
    get:
      tags:
        - 'Signed URLs'
      operationId: signed_urls_image
      summary: 'Render a signed URL'
      description: |-
        Renders the published version of a template with the variants in the URL, then redirects to the image. A repeated URL redirects to the cached image.

        To sign a URL:
        1. Take every query parameter except `signature`.
        2. Sort the parameters by key in byte order.
        3. Join them as `key=value` with `&`. Use the raw values, not the URL-encoded values.
        4. Compute the HMAC-SHA256 of that string with your signing key. Use the lowercase hex digest.
        5. Add the digest as `signature`. URL-encode every value in the final URL.

        Gates: signedUrlMiddleware.

        Note: This route is on the site root, not under /api. The full URL is `https://app.example.com/signed-url/image.jpg`.

        Note: The signed string holds every query parameter except `signature`, including a parameter that the server does not read. Do not send `identifier` or `api_log_uuid`, because the server reserves both names.

        Note: A signed URL render counts in the usage log of the template owner.
      servers:
        -
          url: 'https://app.example.com'
      parameters:
        -
          name: template_id
          in: query
          required: true
          description: 'UUID of the template. The signing key must belong to an active user of the company that owns the template.'
          schema:
            type: string
          example: 141e8454-8aa1-420a-bd0b-18a85ba949a2
        -
          name: variants
          in: query
          required: false
          description: 'The JSON array of Variant objects, encoded as standard base64 (RFC 4648 section 4, with `+`, `/` and `=` padding). Do not use base64url: the server decodes with PHP base64_decode. Sign the base64 value, then URL-encode it in the URL.'
          schema:
            type: string
          example: W3sibGF5ZXIiOiJoZWFkbGluZSIsInRleHQiOiJIZWxsbyJ9XQ==
        -
          name: format
          in: query
          required: false
          description: 'Image format. Defaults to png. Any other value renders png. The value is part of the signature.'
          schema:
            type: string
            enum:
              - png
              - jpeg
              - webp
          example: png
        -
          name: transparent
          in: query
          required: false
          description: 'Set to 1 or true to render on a transparent background. Valid for png and webp. With format=jpeg it returns 400. The value is part of the signature.'
          schema:
            type: string
            enum:
              - '1'
              - '0'
              - 'true'
              - 'false'
          example: '0'
        -
          name: signature
          in: query
          required: true
          description: 'Lowercase hex HMAC-SHA256 of the canonical string. See the description for the algorithm.'
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      responses:
        200:
          description: 'The default placeholder image, with status 200. The server returns it when the signature is missing, when the signature matches no active signing key of the template owner, when the template does not exist, and when the template owner is deactivated. A bad signature does not return an error status.'
          content:
            image/png:
              schema:
                type: string
                format: binary
        302:
          description: 'The image rendered, or a cached image exists. The `Location` header holds the image URL.'
          headers:
            Location:
              description: 'URL of the rendered image.'
              schema:
                type: string
        400:
          description: 'The decoded variants fail the variant rules, the URL asks for format=jpeg with transparent, or the URL has a reserved parameter (`The signed URL has a reserved parameter.`).'
        429:
          description: 'Too many requests from one IP address in one minute. Wait the number of seconds in `Retry-After`.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
