              type: object
              properties:
                title:
                  type: string
                  description: 'Template name. Rules: required|string|max:255.'
                size:
                  type: string
                  description: 'Canvas size preset, for example "instagram_story" or "youtube_thumbnail". It sets width and height for you. GET /v1/templates/sizes lists every preset. Rules: nullable|in:<preset>.'
                width:
                  type: integer
                  description: 'Canvas width in pixels. Required when you send no size preset. Ignored when you send a size preset. Rules: required_without:size|numeric|min:1|max:4000.'
                height:
                  type: integer
                  description: 'Canvas height in pixels. Required when you send no size preset. Ignored when you send a size preset. Rules: required_without:size|numeric|min:1|max:4000.'
                layers:
                  type: array
                  items:
                    $ref: '#/components/schemas/LayerDefinition'
