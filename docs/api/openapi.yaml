      operationId: editor_documents_show
      summary: 'Get the editor document'
      description: |-
        Returns the stored v2 editor document and its revision. A template with no draft returns a null document and revision 0. Read this before every write.

        Gates: throttle:editor-document.

        Note: The read gate and the write gate name the same people. Every account in your company that can write the document can also read it.
      security:
        -
          bearerToken: []
      parameters:
        -
          name: templateUuid
          in: path
          required: true
          description: 'UUID of the template.'
          schema:
            type: string
      responses:
        200:
          description: 'The document and its revision.'
          content:
            application/json:
              example:
                document:
                  version: 2
                  layers:
                    -
                      key: headline
                      type: text
                      properties:
                        -
                          name: fontWeight
                          value: 700
                  groups: []
                revision: 4
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability, or your account is not allowed to read templates.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This action is unauthorized.'
        404:
          description: 'Template not found in your company.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'No query results for model [App\Models\Template].'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
    patch:
      tags:
        - 'Editor documents'
      operationId: editor_documents_apply
      summary: 'Apply editor operations'
      description: |-
        Applies a closed list of layer operations and saves the result under the next revision. `set_layer_property` takes `layer_key`, `property` and `value`. `set_layer_type` takes `layer_key` and `type`. Every operation in one call applies together, or none of them applies.

        Gates: throttle:editor-document.

        Note: A rejected operation returns a stable `code`, for example `editor_operation_layer_not_found` or `editor_operation_invalid_value`. Correct the operation and call again.

        Note: A malformed body returns the standard validation shape instead, with a message under `errors.revision` or `errors.operations`.

        Note: The route allows 30 calls a minute for one token and 180 a minute for one company.
      security:
        -
          bearerToken: []
      parameters:
        -
          name: templateUuid
          in: path
          required: true
          description: 'UUID of the template.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                  description: 'The revision the last read returned. Rules: required|integer|min:0.'
                operations:
                  type: array
                  items:
                    type: object
                    required:
                      - operation
                      - layer_key
                    properties:
                      operation:
                        type: string
                        enum:
                          - set_layer_property
                          - set_layer_type
                      layer_key:
                        type: string
                      property:
                        type: string
                        description: 'set_layer_property only.'
                      value:
                        description: 'set_layer_property only. Any JSON value that the property accepts.'
                      type:
                        type: string
                        description: 'set_layer_type only.'
                  description: 'One to 100 operation objects, applied in order. Rules: required|array|max:100.'
              required:
                - revision
                - operations
            example:
              revision: 4
              operations:
                -
                  operation: set_layer_property
                  layer_key: headline
                  property: fontWeight
                  value: 700
      responses:
        200:
          description: 'The saved document and its new revision.'
          content:
            application/json:
              example:
                document:
                  version: 2
                  layers:
                    -
                      key: headline
