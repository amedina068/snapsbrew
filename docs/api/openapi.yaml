openapi: 3.0.3
info:
  title: 'Snapsbrew API'
  description: |-
    Generate images, PDFs and screenshots from reusable templates. The Snapsbrew API turns design templates into a render pipeline you can call from any stack.

    Rate limits: every bearer endpoint is in the `api` group, which allows 60 requests per minute for one user (or one IP address when the request has no user). The two preview endpoints also allow 10 requests per minute for one user. The editor document endpoints also allow 30 requests per minute for one user and 180 for one company. Over a limit, the API returns 429 with a `Retry-After` header. Each response carries `X-RateLimit-Limit` and `X-RateLimit-Remaining`.
  version: 1.0.0
  contact:
    email: hello@example.com
servers:
  -
    url: 'https://app.example.com/api'
    description: Production
tags:
  -
    name: Authentication
    description: 'Authenticated endpoints use a Sanctum personal access token. Send it as a bearer token in the Authorization header. Tokens must carry the `api_requests` ability. Authorization: Bearer <your-token> Accept: application/json An endpoint that takes a bearer token answers each error with a JSON body, also when the request has no Accept header.'
  -
    name: Guides
    description: 'Guides are static reference catalogs. They tell you which layer properties exist, which overrides a layer accepts, how to compose a template that looks good, and what the v2 editor document contains. They also tell you what a platform does to an image after you upload it, and what a given kind of image has to achieve. The content never changes between accounts, so you can cache a response and reuse it. These endpoints read no template and no company data. They also stay outside the usage log, so a guide call never appears there.'
  -
    name: Templates
    description: 'Templates are reusable designs with addressable layers. List and read them, or manage them programmatically. All template endpoints are scoped to your company.'
  -
    name: 'Editor documents'
    description: 'An editor document is the v2 draft of a template: its layers, its groups and every design-time property the editor shows. A template renders from that draft, so a change here changes what the next render draws. Every write is a compare-and-swap. Read the document, keep the `revision` it returns, and send that revision back. If the stored revision moved, the write returns `409` with the current revision and the current document. Rebuild the change on top of them and send the write again. Never resend the same body with the returned revision. `PATCH` applies a closed list of operations and changes only the properties you name. `PUT` replaces the whole document and drops every property you leave out. `GET /v1/guides/editor-document` carries the constraints both accept.'
  -
    name: Media
    description: 'Upload and list images stored in your account media library. Use these as image-layer sources in snaps.'
  -
    name: Screenshots
    description: 'Render a web page to an image.'
  -
    name: Snaps
    description: 'A snap renders a template (or every template in a collection) into a finished image or PDF, with your content substituted into each layer. Render synchronously for an instant result, or asynchronously with a webhook for bulk work.'
  -
    name: 'Snap batches'
    description: 'A batch renders up to 100 snaps from ONE template, with a different set of variants per item. The call is always asynchronous: it returns 202 with a batch id, and the items render in the background. Poll the batch to read progress and to collect the image URLs, and cancel it to stop the items that have not started. One webhook is posted when the batch finishes.'
  -
    name: Preview
    description: 'Preview renders a template (optionally with variants) into a WATERMARKED, self-contained HTML document without creating a snap. The response is the rendered HTML — nothing is rasterized and nothing is persisted. Use it to iterate, then call POST /v1/snaps to produce the final, un-watermarked snap image with the same variants. A preview allows 10 requests per minute for one user, in addition to the 60 per minute of the api group.'
  -
    name: 'Signed URLs'
    description: 'A signed URL renders a template from a plain `<img src>` or an `og:image` tag, with no API call and no bearer token. Your server builds the URL and signs it with a signed URL key from the Developers tab of the account page. The signing key is a secret. Sign only on a server. Never sign in a browser. The guide at /documentation/guides/signed-urls has code in PHP, JavaScript, Python and Ruby.'
  -
    name: Tags
    description: 'Tags organise templates. Create them, search them, and attach them to templates. All tags are scoped to your company.'
  -
    name: 'Embedded Forms'
    description: 'Embedded forms render snaps from a signed URL — no API token. The URL must be a Laravel signed URL; an invalid signature returns 404. The render counts in the usage log of the form owner.'
paths:
  /v1/auth:
    get:
      tags:
        - Authentication
      operationId: auth_show
      summary: 'Verify the current token'
      description: |-
        Returns the account the token belongs to, with the company it belongs to. Use it to confirm a token is valid and to read the signed-in identity. `company` is null when the account belongs to no company.

        Gates: logApiRequest.
      security:
        -
          bearerToken: []
      responses:
        200:
          description: 'Token is valid.'
          content:
            application/json:
              example:
                data:
                  email: dev@example.com
                  name: 'Ada Lovelace'
                  company: 'Analytical Engines'
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'Token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  /v1/guides/design:
    get:
      tags:
        - Guides
      operationId: guides_design
      summary: 'Get the design guide'
      description: |-
        Returns design guidance for building a template: canvas presets, the back-to-front layer order, typography and color rules, composition recipes, anti-patterns, and a preflight checklist. Read it before you write a `layers` array.

        Note: The catalog is the same for every account. Cache the response and refresh it on a new API version.

        Note: A guide call does not appear in the usage log.
      security:
        -
          bearerToken: []
      responses:
        200:
          description: 'The catalog, trimmed here to one entry.'
          content:
            application/json:
              example:
                data:
                  typography:
                    scale: 'On a 1080px canvas: headline 64–120px, subhead 36–56px, body 24–36px.'
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  /v1/guides/layers:
    get:
      tags:
        - Guides
      operationId: guides_layers
      summary: 'Get the layer schema'
      description: |-
        Returns the design-time layer vocabulary: the layer object shape, every property name, the value shape of each property, and a worked example. Use it to build the `layers` array a template write accepts.

        Note: The catalog is the same for every account. Cache the response and refresh it on a new API version.

        Note: A guide call does not appear in the usage log.
      security:
        -
          bearerToken: []
      responses:
        200:
          description: 'The catalog, trimmed here to one entry.'
          content:
            application/json:
              example:
                data:
                  property_names:
                    - textContent
                    - backgroundType
                    - fontFamily
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  /v1/guides/variant-properties:
    get:
      tags:
        - Guides
      operationId: guides_variant_properties
      summary: 'List variant properties'
      description: |-
        Returns every property you can apply to a layer in `variants`, with its value type, the layer types it applies to, and an example. Pair it with the `available_modifications` of a template layer.

        Note: The catalog is the same for every account. Cache the response and refresh it on a new API version.

        Note: A guide call does not appear in the usage log.
      security:
        -
          bearerToken: []
      responses:
        200:
          description: 'The catalog, trimmed here to one entry.'
          content:
            application/json:
              example:
                data:
                  -
                    property: text
                    value_type: string
                    applies_to: 'text layers'
                    description: "Replace a text layer's content."
                    example:
                      layer: headline
                      text: 'Summer Sale — 40% off'
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  /v1/guides/editor-document:
    get:
      tags:
        - Guides
      operationId: guides_editor_document
      summary: 'Get the editor document contract'
      description: |-
        Returns the versioned v2 editor-document contract: the resource it describes, property constraints, persistence rules, conflict recovery, and a safe workflow. Read it before you change an editor document.

        Note: The catalog is the same for every account. Cache the response and refresh it on a new API version.

        Note: A guide call does not appear in the usage log.
      security:
        -
          bearerToken: []
      responses:
        200:
          description: 'The catalog, trimmed here to one entry.'
          content:
            application/json:
              example:
                data:
                  contract_version: 2
                  editor_document_version: 2
                  resource: template.editor_document
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  /v1/guides/platforms:
    get:
      tags:
        - Guides
      operationId: guides_platforms
      summary: 'List platform guides'
      description: |-
        Returns one line per platform: the size preset to start from, its dimensions and why that preset is the default. Read it to choose a platform, then read that platform for the full rules. The response also carries `specs_reviewed`, the month the published specs were last checked.

        Note: The catalog is the same for every account. Cache the response and refresh it on a new API version.

        Note: A guide call does not appear in the usage log.
      security:
        -
          bearerToken: []
      responses:
        200:
          description: 'The catalog, trimmed here to one entry.'
          content:
            application/json:
              example:
                data:
                  -
                    platform: instagram
                    name: Instagram
                    start_here: instagram_post
                    dimensions: 1080x1350
                    why: 'A 4:5 portrait post fills the most vertical space the feed will give a single image.'
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  '/v1/guides/platforms/{platform}':
    get:
      tags:
        - Guides
      operationId: guides_platform
      summary: 'Get one platform guide'
      description: |-
        Returns everything one platform does to an image: how it crops the frame, the directional UI safe zones where it paints its own controls, the accepted formats and size limits, the export width and color profile, its size presets, and its rules and anti-patterns.

        Note: The catalog is the same for every account. Cache the response and refresh it on a new API version.

        Note: A guide call does not appear in the usage log.

        Note: An alias is accepted. `/v1/guides/platforms/insta` returns the same guide as `/v1/guides/platforms/instagram`.
      security:
        -
          bearerToken: []
      parameters:
        -
          name: platform
          in: path
          required: true
          description: 'A key from the index route, or a common alias. Maximum 64 characters. Valid keys: instagram, facebook, x, linkedin, threads, pinterest, tiktok, youtube, snapchat, whatsapp, web, ads, print.'
          schema:
            type: string
      responses:
        200:
          description: 'The catalog, trimmed here to one entry.'
          content:
            application/json:
              example:
                data:
                  platform: instagram
                  name: Instagram
                  specs_reviewed: 2026-09
                  start_here: instagram_post
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        404:
          description: 'No guide matches the key. The body names every valid key.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - available
                properties:
                  message:
                    type: string
                  available:
                    type: array
                    items:
                      type: string
              example:
                message: 'No platform guide matches `myspace`.'
                available:
                  - instagram
                  - facebook
                  - x
                  - linkedin
                  - threads
                  - pinterest
                  - tiktok
                  - youtube
                  - snapchat
                  - whatsapp
                  - web
                  - ads
                  - print
        422:
          description: 'The key is longer than 64 characters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The platform must not be greater than 64 characters.'
                errors:
                  platform:
                    - 'The platform must not be greater than 64 characters.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  /v1/guides/purposes:
    get:
      tags:
        - Guides
      operationId: guides_purposes
      summary: 'List image purpose guides'
      description: |-
        Returns one line per purpose: what that kind of image is, when to use it and the size presets that fit it. Read it to choose a purpose, then read that purpose for the full rules.

        Note: The catalog is the same for every account. Cache the response and refresh it on a new API version.

        Note: A guide call does not appear in the usage log.
      security:
        -
          bearerToken: []
      responses:
        200:
          description: 'The catalog, trimmed here to one entry.'
          content:
            application/json:
              example:
                data:
                  -
                    purpose: link_preview
                    name: 'Link preview / meta tag image'
                    use_when: 'You are shipping a page and you want the shared link to look deliberate.'
                    sizes:
                      - open_graph
                      - twitter_card
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  '/v1/guides/purposes/{purpose}':
    get:
      tags:
        - Guides
      operationId: guides_purpose
      summary: 'Get one image purpose guide'
      description: |-
        Returns the job one kind of image has to do: the size presets that fit it, the rules and failure modes specific to it, a layer recipe in the Snapsbrew vocabulary, an anti-pattern list and a preflight checklist. The `link_preview` purpose also returns the og: and twitter: meta tags to put in the page head.

        Note: The catalog is the same for every account. Cache the response and refresh it on a new API version.

        Note: A guide call does not appear in the usage log.

        Note: An alias is accepted. `/v1/guides/purposes/og` returns the same guide as `/v1/guides/purposes/link_preview`.
      security:
        -
          bearerToken: []
      parameters:
        -
          name: purpose
          in: path
          required: true
          description: 'A key from the index route, or a common alias. Maximum 64 characters. Valid keys: link_preview, feed_post, carousel, story, profile_picture, cover, video_thumbnail, ad, product_shot, email_header, article_header, presentation_slide.'
          schema:
            type: string
      responses:
        200:
          description: 'The catalog, trimmed here to one entry.'
          content:
            application/json:
              example:
                data:
                  purpose: link_preview
                  name: 'Link preview / meta tag image'
                  layer_recipe: 'base fill -> optional photo with a dark scrim -> headline -> supporting line -> logo.'
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        404:
          description: 'No guide matches the key. The body names every valid key.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - available
                properties:
                  message:
                    type: string
                  available:
                    type: array
                    items:
                      type: string
              example:
                message: 'No purpose guide matches `wallpaper`.'
                available:
                  - link_preview
                  - feed_post
                  - carousel
                  - story
                  - profile_picture
                  - cover
                  - video_thumbnail
                  - ad
                  - product_shot
                  - email_header
                  - article_header
                  - presentation_slide
        422:
          description: 'The key is longer than 64 characters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The purpose must not be greater than 64 characters.'
                errors:
                  purpose:
                    - 'The purpose must not be greater than 64 characters.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  /v1/templates:
    get:
      tags:
        - Templates
      operationId: templates_index
      summary: 'List templates'
      description: |-
        Returns a cursor-paginated list of your templates.

        Gates: logApiRequest.
      security:
        -
          bearerToken: []
      parameters:
        -
          name: cursor
          in: query
          required: false
          description: "Cursor token from a previous response's meta.next_cursor."
          schema:
            type: string
      responses:
        200:
          description: 'A page of templates.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateListItem'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
              example:
                data:
                  -
                    uuid: 141e8454-8aa1-420a-bd0b-18a85ba949a2
                    title: 'Template 1'
                    width: 1200
                    height: 630
                    layers:
                      -
                        layer: review_title
                        available_modifications:
                          text: 'The worst Time-Travel movie ever made'
                    created_at: '2026-05-01T12:00:00Z'
                meta:
                  previous_cursor: null
                  next_cursor: eyJpZCI6MTB9
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        422:
          description: 'A query parameter failed a rule.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The cursor must be a string.'
                errors:
                  cursor:
                    - 'The cursor must be a string.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
