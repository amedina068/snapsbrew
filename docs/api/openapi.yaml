    get:
      tags:
        - Templates
      operationId: templates_show
      summary: 'Get a template'
      description: |-
        Returns a single template, its parsed layers and its publish state. The layers are the draft, so read `has_unpublished_edits` to know whether the draft is what renders.

        Gates: logApiRequest.

        Note: BREAKING CHANGE. The template fields moved under a `data` key. Read `data.uuid`, not `uuid`. The template, auth, guide, screenshot and tag endpoints wrap the resource in `data`. A list adds `meta` and a write adds `message`.

        Note: Not every success body has a `data` key. POST /v1/snaps, the batch endpoints, the media endpoints and the editor document endpoints return the object with no wrapper. GET /v1/media returns a flat Laravel paginator.

        Note: A layer has no `type` field. `available_modifications` maps each override key to its current value, and a layer with no override returns an empty array `[]`.

        Note: `size` is the canvas size preset the template is stored under, the same value POST /v1/templates returns. It reads `custom` when the dimensions match no preset. GET /v1/templates/sizes lists every preset.

        Note: `published_version` is the version number snaps and previews render. It is null until you publish the template.

        Note: `has_unpublished_edits` is true when the draft is not the same as the published version. A layer edit, a resize and an editor-document edit all set it. Call POST /v1/templates/{templateUuid}/publish to make the draft render.
