                    identifier: row-1
                    status: completed
                    media_url: 'https://app.example.com/storage/snaps/9f1c2d3e.png'
                    last_error: null
                  -
                    id: 4b8a7c6d
                    identifier: row-2
                    status: canceled
                    media_url: null
                    last_error: null
                  -
                    id: 2e5f9a1b
                    identifier: row-3
                    status: canceled
                    media_url: null
                    last_error: null
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
