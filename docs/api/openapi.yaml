                  - code
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    enum:
                      - idempotency_key_in_progress
                      - idempotency_key_belongs_to_batch
              example:
                message: 'A request with this idempotency_key is already in progress. Retry in a moment. Nothing was created and nothing was charged.'
                code: idempotency_key_in_progress
        422:
          description: 'Validation failed. A `template_id` or `collection_id` that does not exist in your company fails the `exists` rule, so it returns 422 with a message under `errors.template_id` or `errors.collection_id`, not 404.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The selected template id is invalid.'
                errors:
                  template_id:
                    - 'The selected template id is invalid.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
