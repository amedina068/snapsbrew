        Gates: policy:create,Template.

        Note: Send a `size` preset or an explicit `width`/`height`. A template saved with dimensions that match a preset is stored under that preset.

        Note: A body with no `size` and no `width`/`height` answers 422. A create has no stored canvas to fall back on.

