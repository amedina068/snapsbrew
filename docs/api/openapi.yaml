  /v1/snaps/batches:
    post:
      tags:
        - 'Snap batches'
      operationId: snap_batches_store
      summary: 'Create a batch of snaps'
      description: |-
        Renders up to 100 snaps from one template. Every item carries its own `variants` and an optional `identifier` you use to recognize it in the result.

        The response is always 202. Each item renders in the background.

        `type`, `format` and `transparent` apply to every item in the batch. An item that needs a different format belongs in a different batch.

        The API always renders the template's **published** version.

        Gates: logApiRequest.

        Note: Over 100 items returns 422 on `errors.items` and creates nothing. The request is never truncated in silence.

        Note: Exactly one webhook is posted, when the batch finishes. There is no per-item webhook on this endpoint.

        Note: Each webhook carries three headers: `X-Snapsbrew-Delivery` (one ID for all attempts of a delivery), `X-Snapsbrew-Timestamp` (Unix seconds) and `X-Snapsbrew-Signature`. The signature is the HMAC-SHA256 hex digest of `{timestamp}.{raw body}` with the webhook signing secret of your company (**Account > Developers**). Compare it in constant time, and reject a timestamp that is more than five minutes old.

        Note: `webhook_url` must be a public address. A host that resolves to a private, loopback, link-local or reserved range is rejected with 422.

        Note: A response to a repeated `idempotency_key` carries an `X-Idempotent-Replay: true` header.

        Note: Every response carries an `X-Request-Uuid` header. Quote it in support tickets.

        Note: A batch holds one of five statuses. `pending` and `processing` mean it is still running. The three terminal statuses are `completed`, `failed` and `canceled`, and a batch never leaves one. `completed` means the batch ran to the end and at least one item rendered, so read the `failed` count as well as the status. `failed` means zero items rendered. At every terminal status `completed + failed + canceled` equals `total_rows`.
      security:
        -
          bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template_id:
                  type: string
                  description: 'UUID of the template every item renders from. Rules: required, exists templates.uuid scoped to company.'
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      identifier:
                        type: string
                        nullable: true
                        maxLength: 191
                        description: 'Your own name for this item.'
                      variants:
                        type: array
                        items:
                          $ref: '#/components/schemas/Variant'
                        description: 'Per-layer content overrides for this item.'
                  description: 'One object per snap. Over 100 entries returns 422 and creates nothing. Rules: required, array, min:1, max:100.'
                title:
                  type: string
                  description: 'A name for the batch, shown in the account. Defaults to "API batch". Rules: sometimes, string, max:255.'
                webhook_url:
                  type: string
                  description: 'ONE request is posted to this address when the batch finishes. A host that resolves to a private, loopback, link-local or reserved range is rejected with 422. Rules: nullable, url, max:2048, must be a public http or https address.'
                type:
                  type: string
                  description: 'Output type for every item. Defaults to image. Rules: sometimes, in:image,pdf.'
                format:
                  type: string
                  description: 'Image output format for every item. Defaults to png. Rules: sometimes, in:png,jpeg,webp.'
                transparent:
                  type: boolean
                  description: 'Render every item on a transparent background. Valid for png and webp only. Rules: sometimes, boolean; 422 when combined with format=jpeg.'
                idempotency_key:
                  type: string
                  description: 'Send the same key when you retry after a timeout. The retry returns the same batch and starts no second one. Keys are honored for 24 hours and are scoped to your account. A key already used by POST /v1/snaps returns 409. Rules: sometimes, nullable, string, max:191, letters/digits/underscore/hyphen only.'
              required:
                - template_id
                - items
            example:
              template_id: '<uuid>'
              title: 'October launch'
              items:
                -
                  identifier: row-1
                  variants:
                    -
                      layer: headline
                      text: Hello
                -
                  identifier: row-2
                  variants:
                    -
                      layer: headline
                      text: World
      responses:
        202:
          description: 'Batch accepted and queued. The body is the batch with no `data` wrapper.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              example:
                uuid: 7c1f2a9e-0b44-4a1e-9f2b-5d3c8e1a7b60
                title: 'October launch'
                status: processing
                total_rows: 3
                processed_rows: 0
                completed: 0
                pending: 3
                failed: 0
                canceled: 0
                status_url: 'https://app.example.com/api/v1/snaps/batches/7c1f2a9e-0b44-4a1e-9f2b-5d3c8e1a7b60'
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        409:
          description: 'The idempotency_key cannot be used. Read `code`: `idempotency_key_in_progress` means another request holds the key, so retry with the same key. `idempotency_key_belongs_to_snap` means a single snap owns the key, so send a new key. Nothing was created.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - code
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    enum:
                      - idempotency_key_in_progress
                      - idempotency_key_belongs_to_snap
              example:
                message: 'This idempotency_key already belongs to a single snap. Use a new key for a batch.'
                code: idempotency_key_belongs_to_snap
        422:
          description: 'Validation failed. A `template_id` that does not exist in your company returns 422 under `errors.template_id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'A batch accepts at most 100 items. Split the request into smaller batches.'
                errors:
                  items:
                    - 'A batch accepts at most 100 items. Split the request into smaller batches.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
        500:
          description: 'An unexpected error stopped the request. The body holds a fixed message and the code `internal_error`, and no detail of the cause. The server logs the cause.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
              example:
                message: 'The server could not create the batch. Try again later. If the error continues, contact support and give the X-Request-Uuid header of this response.'
                code: internal_error
  '/v1/snaps/batches/{batchUuid}':
    get:
      tags:
        - 'Snap batches'
      operationId: snap_batches_show
      summary: 'Read a batch'
      description: |-
        Returns the counts and every item with its status and image URL. Poll this about every 5 seconds and stop when `status` is `completed`, `failed` or `canceled`.

        Gates: logApiRequest.

        Note: A batch holds one of five statuses. `pending` and `processing` mean it is still running. The three terminal statuses are `completed`, `failed` and `canceled`, and a batch never leaves one. `completed` means the batch ran to the end and at least one item rendered, so read the `failed` count as well as the status. `failed` means zero items rendered. At every terminal status `completed + failed + canceled` equals `total_rows`.

        Note: `media_url` is the image URL on an item with status `completed`, and null on each other item. The snap object of POST /v1/snaps uses an empty string for the same state.

        Note: `last_error` on a failed item holds the fixed code `render_failed`. It never holds the message of the renderer.

        Note: A batch id that belongs to another account returns 404, the same as an id that does not exist.
      security:
        -
          bearerToken: []
      parameters:
        -
          name: batchUuid
          in: path
          required: true
          description: 'The batch id returned by POST /v1/snaps/batches.'
          schema:
            type: string
      responses:
        200:
          description: 'The batch and its items, with no `data` wrapper.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              example:
                uuid: 7c1f2a9e-0b44-4a1e-9f2b-5d3c8e1a7b60
                title: 'October launch'
                status: completed
                total_rows: 2
                processed_rows: 2
                completed: 1
                pending: 0
                failed: 1
                canceled: 0
                status_url: 'https://app.example.com/api/v1/snaps/batches/7c1f2a9e-0b44-4a1e-9f2b-5d3c8e1a7b60'
                items:
                  -
                    id: 9f1c2d3e
                    identifier: row-1
                    status: completed
                    media_url: 'https://app.example.com/storage/snaps/9f1c2d3e.png'
                    last_error: null
                  -
                    id: 4b8a7c6d
                    identifier: row-2
                    status: failed
                    media_url: null
                    last_error: render_failed
        401:
          description: 'Missing or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthenticated.
        403:
          description: 'The token lacks the api_requests ability.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid ability provided.'
        404:
          description: 'No batch with that id exists in your account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'No batch with that id exists in your account.'
        429:
          description: 'Rate limit exceeded. Wait the number of seconds in `Retry-After`, then send the request again.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Too Many Attempts.'
  '/v1/snaps/batches/{batchUuid}/cancel':
    post:
      tags:
        - 'Snap batches'
      operationId: snap_batches_cancel
      summary: 'Cancel a batch'
      description: |-
        Stops a batch that is still running.

        An item that already rendered keeps its image. An item that had not started is marked `canceled` and never renders. An item that is rendering at that moment can still finish.

        This cannot be undone. A canceled batch cannot be resumed. Start a new batch for the items you still want.

        Gates: logApiRequest.

        Note: Canceling twice is safe. A batch that already holds a terminal status is returned unchanged.

        Note: One webhook is posted, carrying `event: snap-import.canceled`.

        Note: An item that is rendering when the cancel lands can still complete. The counts in the response are the truth at that moment.

        Note: A batch id that belongs to another account returns 404, the same as an id that does not exist.
      security:
        -
          bearerToken: []
      parameters:
        -
          name: batchUuid
          in: path
          required: true
          description: 'The batch id returned by POST /v1/snaps/batches.'
          schema:
            type: string
      responses:
        200:
          description: 'The batch after the cancel, with its items and no `data` wrapper.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              example:
                uuid: 7c1f2a9e-0b44-4a1e-9f2b-5d3c8e1a7b60
                title: 'October launch'
                status: canceled
                total_rows: 3
                processed_rows: 3
                completed: 1
                pending: 0
                failed: 0
                canceled: 2
                status_url: 'https://app.example.com/api/v1/snaps/batches/7c1f2a9e-0b44-4a1e-9f2b-5d3c8e1a7b60'
                items:
