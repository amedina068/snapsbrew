  '/v1/embedded-forms/{formUuid}':
    post:
      tags:
        - 'Embedded Forms'
      operationId: embedded_forms_store
      summary: 'Submit an embedded form'
      description: |-
        Renders a snap from a configured form. Template forms return one snap; collection forms return an array of snaps.

        Layer keys: template forms use the plain layer key (`headline`); collection forms use `{templateUuid}__{layerKey}`. Only layers the form was configured with are accepted; the rest are dropped silently.

        Gates: embeddedFormMiddleware, valid signature required.

        Note: Collection forms return a bare array of snap objects, not a `data`-wrapped object.

        Note: The route limits the submissions for each IP address and for each form, each minute.
      parameters:
        -
          name: formUuid
          in: path
          required: true
          description: 'UUID of the form.'
          schema:
            type: string
        -
          name: signature
          in: query
          required: true
          description: 'Laravel URL signature. The whole URL must be signed.'
          schema:
            type: string
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                layers:
                  type: object
                  description: 'Layer overrides. Value keys by layer type: image -> image_url (file), text -> text, empty -> background_color, qr_code -> qr_content, barcode -> barcode_content. Rules: keys matched against the form configuration; an image layer takes a jpg, png, gif, webp or bmp file of 10 MB or less; a color takes a hex, rgb(a), hsl(a) or named color.'
      responses:
        201:
          description: 'Snap rendered (template form). The body is the snap with no `data` wrapper.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snap'
              example:
                id: 9f1c2d3e
                media_url: 'https://app.example.com/storage/snaps/9f1c2d3e.png'
                width: 1200
                height: 630
                type: image
                status: completed
                is_async: false
                webhook_url: null
                completed_at: '2026-05-01T12:00:03Z'
                last_error: null
                variants: []
                template_id: '141e8454'
                template_title: 'Launch card'
                created_at: '2026-05-01T12:00:00Z'
        404:
          description: 'The form does not exist, or the signature is not valid. A bad signature returns an empty `message`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'No query results for model [App\Models\Form].'
        422:
          description: 'Collection form has no templates configured, or a layer value fails validation.'
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/Error'
                  -
                    $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The form does not include any templates.'
        429:
          description: 'Too many submissions from one IP address or for one form. Wait the number of seconds in `Retry-After`.'
          headers:
            Retry-After:
              description: 'Seconds to wait before the next request.'
              schema:
                type: integer
                example: 30
            X-RateLimit-Limit:
              description: 'Requests allowed in the current minute.'
              schema:
                type: integer
                example: 60
            X-RateLimit-Remaining:
              description: 'Requests left in the current minute.'
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - code
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    enum:
                      - rate_limited
              example:
                message: 'Too many submissions. Wait one minute, then send the form again.'
                code: rate_limited
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: 'Sanctum personal access token with the api_requests ability.'
  schemas:
    Variant:
      description: 'One override for one layer: the layer key and exactly one override property. GET /v1/guides/variant-properties lists each property with an example.'
      oneOf:
        -
          type: object
          required:
            - layer
            - text
          additionalProperties: false
          properties:
            layer:
              type: string
              description: 'Key of the layer to override.'
            text:
              type: string
              description: "Replace a text layer's content."
        -
          type: object
          required:
            - layer
            - image_url
          additionalProperties: false
          properties:
            layer:
              type: string
              description: 'Key of the layer to override.'
            image_url:
              type: string
              format: uri
              description: "Swap a layer's background image. Must be a public URL — internal, reserved, and file:// addresses are rejected."
        -
          type: object
          required:
            - layer
            - background_color
          additionalProperties: false
          properties:
            layer:
              type: string
              description: 'Key of the layer to override.'
            background_color:
              type: string
              description: 'Set a layer background color.'
        -
          type: object
          required:
            - layer
            - qr_content
          additionalProperties: false
          properties:
            layer:
              type: string
              description: 'Key of the layer to override.'
            qr_content:
              type: string
              description: 'Set the content encoded by a QR-code layer (often a URL).'
        -
          type: object
          required:
            - layer
            - barcode_content
          additionalProperties: false
          properties:
            layer:
              type: string
              description: 'Key of the layer to override.'
            barcode_content:
              type: string
              maxLength: 1000
              description: "Set the value encoded by a barcode layer. Must be valid for the layer's symbology (e.g. EAN-13 needs 12-13 digits)."
        -
          type: object
          required:
            - layer
            - hidden
          additionalProperties: false
          properties:
            layer:
              type: string
              description: 'Key of the layer to override.'
            hidden:
              type: boolean
              description: 'Drop the layer from the render entirely.'
    LayerDefinition:
      type: object
      description: 'One layer in the `layers` array of a template write: a unique key and its design-time properties. GET /v1/guides/layers lists every property name and value shape.'
      properties:
        key:
          type: string
          description: 'Unique layer key. Variants target this key.'
        type:
          type: string
          description: 'Editor layer type, for example text, image, qr_code, barcode or empty. Optional.'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/LayerProperty'
          description: 'Design-time properties. Send [] for none.'
      required:
        - key
        - properties
    LayerProperty:
      type: object
      description: 'One design-time property of a layer.'
      properties:
        name:
          type: string
          description: 'Property name, for example textContent or fontFamily.'
        value:
          description: 'Any JSON value. The shape depends on the property.'
      required:
        - name
    Template:
      type: object
      description: 'One template, as GET /v1/templates/{templateUuid} returns it under `data`.'
      properties:
        uuid:
          type: string
          description: 'Stable public identifier.'
        title:
          type: string
          description: 'Human-readable name.'
        size:
          type: string
          nullable: true
          description: 'Canvas size preset, or `custom`.'
        width:
          type: integer
          description: 'Canvas width in pixels.'
        height:
          type: integer
          description: 'Canvas height in pixels.'
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
          description: 'Addressable layers and their modifications.'
        published_version:
          type: integer
          nullable: true
          description: 'The version that renders. Null until the first publish.'
        has_unpublished_edits:
          type: boolean
          description: 'True when the draft differs from the published version.'
        created_at:
          type: string
          format: date-time
          description: 'ISO-8601 creation timestamp.'
      required:
        - uuid
        - title
        - size
        - width
        - height
        - layers
        - published_version
        - has_unpublished_edits
        - created_at
      additionalProperties: false
    TemplateListItem:
      type: object
      description: 'One template in the list of GET /v1/templates.'
      properties:
        uuid:
          type: string
          description: 'Stable public identifier.'
        title:
          type: string
          description: 'Human-readable name.'
        width:
          type: integer
          description: 'Canvas width in pixels.'
        height:
          type: integer
          description: 'Canvas height in pixels.'
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
          description: 'Addressable layers and their modifications.'
        created_at:
          type: string
          format: date-time
          description: 'ISO-8601 creation timestamp.'
      required:
        - uuid
        - title
        - width
        - height
        - layers
        - created_at
      additionalProperties: false
    TemplateSummary:
      type: object
      description: 'The six fields that a template create or update returns under `data`.'
      properties:
        uuid:
          type: string
          description: 'Stable public identifier.'
        title:
          type: string
          description: 'Human-readable name.'
        size:
          type: string
          nullable: true
          description: 'Canvas size preset, or `custom`.'
        width:
          type: integer
          description: 'Canvas width in pixels.'
        height:
          type: integer
          description: 'Canvas height in pixels.'
        created_at:
          type: string
          format: date-time
          description: 'ISO-8601 creation timestamp.'
      required:
        - uuid
        - title
        - size
        - width
        - height
        - created_at
      additionalProperties: false
    Layer:
      type: object
      description: 'One addressable layer of a template, as the template endpoints return it. The response has no `type` field.'
      properties:
        layer:
          type: string
          nullable: true
          description: 'Layer key used when overriding content.'
        available_modifications:
          oneOf:
            -
              type: object
              minProperties: 1
              additionalProperties:
                type: string
                nullable: true
            -
              type: array
              maxItems: 0
              items:
                type: string
          description: 'Maps each override key that this layer accepts (image_url, text, qr_content, barcode_content) to its current value. A layer with no override, for example an empty or svg layer, returns an empty array `[]`, not `{}`.'
      required:
        - layer
        - available_modifications
      additionalProperties: false
    Screenshot:
      type: object
      description: 'A rendered capture of a web page, as the read and the create return it under `data`. The id field is `id`.'
      properties:
        id:
          type: string
          description: 'Screenshot UUID.'
        url:
          type: string
          description: 'Captured page URL.'
        image_url:
          type: string
          nullable: true
          description: 'URL of the rendered image.'
        width:
          type: integer
          description: 'Viewport width in pixels.'
        height:
          type: integer
          description: 'Viewport height in pixels.'
        created_at:
          type: string
          format: date-time
          description: 'ISO-8601 creation timestamp.'
      required:
        - id
        - url
        - image_url
        - width
        - height
        - created_at
      additionalProperties: false
    ScreenshotListItem:
      type: object
      description: 'One screenshot in the list of GET /v1/screenshots. The id field is `uuid`, not `id`.'
      properties:
        uuid:
          type: string
          description: 'Screenshot UUID. The same value as `id` in the read.'
        url:
          type: string
          description: 'Captured page URL.'
        image_url:
          type: string
          nullable: true
          description: 'URL of the rendered image.'
        width:
          type: integer
          description: 'Viewport width in pixels.'
        height:
          type: integer
          description: 'Viewport height in pixels.'
        created_at:
          type: string
          format: date-time
          description: 'ISO-8601 creation timestamp.'
      required:
        - uuid
        - url
        - image_url
        - width
        - height
        - created_at
      additionalProperties: false
    Snap:
      type: object
      description: 'A render job produced from a template or collection. POST /v1/snaps returns it with no `data` wrapper.'
      properties:
        id:
          type: string
          description: 'Snap UUID.'
        media_url:
          type: string
          description: 'URL of the finished asset. An empty string when the snap has no finished asset: pending, processing, failed or canceled. Never null. A batch item uses null for the same state.'
        width:
          type: integer
          nullable: true
          description: 'Width in pixels of the version that rendered. Null when the snap has no source.'
        height:
          type: integer
          nullable: true
          description: 'Height in pixels of the version that rendered. Null when the snap has no source.'
        type:
          type: string
          enum:
            - image
            - pdf
          description: 'image or pdf.'
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - canceled
          description: 'pending, processing, completed, failed or canceled.'
        is_async:
          type: boolean
          description: 'Whether the snap was queued.'
        webhook_url:
          type: string
          nullable: true
          description: 'Callback URL for async completion.'
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: 'When rendering finished.'
        last_error:
          type: string
          nullable: true
          description: 'A fixed code, when status is failed: `render_failed`, or a webhook code (`webhook_address_refused`, `webhook_redirect_refused`, `webhook_unreachable`, `webhook_http_<status>`). Null otherwise.'
        variants:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Variant'
          description: 'The variants applied, as sent. Null when the request sent none.'
        template_id:
          type: string
          nullable: true
          description: 'Source template UUID. Null for a snap rendered from an inline design, which has no template.'
        template_title:
          type: string
          nullable: true
          description: 'Source template name. Null for a snap rendered from an inline design.'
        created_at:
          type: string
          format: date-time
          description: 'ISO-8601 creation timestamp.'
      required:
        - id
        - media_url
        - width
        - height
        - type
        - status
        - is_async
        - webhook_url
        - completed_at
        - last_error
        - variants
        - template_id
        - template_title
        - created_at
      additionalProperties: false
    Batch:
      type: object
      description: 'The progress of a batch. The create returns it with no `items`. The read and the cancel add `items`. No `data` wrapper.'
      properties:
        uuid:
          type: string
          description: 'Batch UUID.'
        title:
          type: string
          description: 'Batch name.'
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - canceled
          description: 'pending, processing, completed, failed or canceled.'
        total_rows:
          type: integer
          description: 'Number of items.'
        processed_rows:
          type: integer
          description: 'completed + failed + canceled.'
        completed:
          type: integer
          description: 'Items that rendered.'
        pending:
          type: integer
          description: 'Items that wait or render now.'
        failed:
          type: integer
          description: 'Items that failed.'
        canceled:
          type: integer
          description: 'Items that a cancel stopped.'
        status_url:
          type: string
          description: 'URL of GET /v1/snaps/batches/{batchUuid}.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchItem'
          description: 'Every item. Only the read and the cancel return it.'
      required:
        - uuid
        - title
        - status
        - total_rows
        - processed_rows
        - completed
        - pending
        - failed
        - canceled
        - status_url
      additionalProperties: false
    BatchItem:
      type: object
      description: 'One item of a batch.'
      properties:
        id:
          type: string
          description: 'Snap UUID.'
        identifier:
          type: string
          nullable: true
          description: 'Your name for the item, or item_1, item_2 and so on.'
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - canceled
          description: 'Item status.'
        media_url:
          type: string
          nullable: true
          description: 'Image URL when the status is completed. Null when the item is not complete: pending, processing, failed or canceled. Never an empty string. The snap object uses an empty string for the same state.'
        last_error:
          type: string
          nullable: true
          description: 'A fixed code, when the item failed: `render_failed`. Null otherwise.'
      required:
        - id
        - identifier
        - status
        - media_url
        - last_error
      additionalProperties: false
    Media:
      type: object
      description: 'One image in your media library. The upload and the list return these fields and no other field.'
      properties:
        id:
          type: integer
          description: 'Numeric media id.'
        uuid:
          type: string
          description: 'Media UUID.'
        name:
          type: string
          description: 'File name without the extension.'
        file_name:
          type: string
          description: 'Stored file name.'
        mime_type:
          type: string
          nullable: true
          description: 'MIME type of the upload.'
        size:
          type: integer
          description: 'File size in bytes.'
        original_url:
          type: string
          description: 'URL of the original file.'
        src:
          type: string
          description: 'URL of the `image` conversion. Use it as an image_url variant.'
        created_at:
          type: string
          format: date-time
          description: 'ISO-8601 upload timestamp.'
      required:
        - id
        - uuid
        - name
        - file_name
        - mime_type
        - size
        - original_url
        - src
        - created_at
      additionalProperties: false
    MediaPage:
      type: object
      description: 'A flat Laravel length-aware paginator: the page fields sit next to `data`, with no `meta` key.'
      properties:
        current_page:
          type: integer
          description: 'Page number.'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Media'
          description: 'The media on this page, newest first.'
        first_page_url:
          type: string
          description: 'URL of page 1.'
        from:
          type: integer
          nullable: true
          description: 'Position of the first item on this page.'
        last_page:
          type: integer
          description: 'Number of the last page.'
        last_page_url:
          type: string
          description: 'URL of the last page.'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PaginatorLink'
          description: 'Page links for a pager.'
        next_page_url:
          type: string
          nullable: true
          description: 'URL of the next page, or null.'
        path:
          type: string
          description: 'Base URL of the list.'
        per_page:
          type: integer
          description: 'Items per page (12).'
        prev_page_url:
          type: string
          nullable: true
          description: 'URL of the previous page, or null.'
        to:
          type: integer
          nullable: true
          description: 'Position of the last item on this page.'
        total:
          type: integer
          description: 'Number of media in the library.'
      required:
        - current_page
        - data
        - first_page_url
        - from
        - last_page
        - last_page_url
        - links
        - next_page_url
        - path
        - per_page
        - prev_page_url
        - to
        - total
    PaginatorLink:
      type: object
      description: 'One link of a Laravel paginator.'
      properties:
        url:
          type: string
          nullable: true
          description: 'Page URL, or null.'
        label:
          type: string
          description: 'Link label.'
        active:
          type: boolean
          description: 'True for the current page.'
      required:
        - url
        - label
        - active
    CursorMeta:
      type: object
      description: 'The cursor of a cursor-paginated list.'
      properties:
        previous_cursor:
          type: string
          nullable: true
          description: 'Cursor of the previous page, or null.'
        next_cursor:
          type: string
          nullable: true
          description: 'Cursor of the next page, or null.'
      required:
        - previous_cursor
        - next_cursor
    Error:
      type: object
      description: 'An error with a message only.'
      properties:
        message:
          type: string
          description: 'What went wrong.'
      required:
        - message
    InternalError:
      type: object
      description: 'A 500 error. The server could not complete the request. The body holds no detail of the cause. Quote the `X-Request-Uuid` header in a support ticket.'
      properties:
        message:
          type: string
          description: 'A fixed message for a person to read.'
        code:
          type: string
          enum:
            - internal_error
          description: 'Always `internal_error`.'
      required:
        - message
        - code
      additionalProperties: false
    EditorDocumentConflict:
      type: object
      description: 'A 409 on an editor document write. The stored revision moved, so nothing was saved. Rebuild the change on `current_document` and send it with `current_revision`.'
      properties:
        code:
          type: string
          enum:
            - editor_document_conflict
          description: 'Always `editor_document_conflict`.'
        message:
          type: string
          description: 'What went wrong and what to do. Do not branch on this text.'
        current_revision:
          type: integer
          description: 'The stored revision.'
        current_document:
          type: object
          description: 'The stored document.'
      required:
        - code
        - message
        - current_revision
        - current_document
    EditorOperationError:
      type: object
      description: 'A 422 when the document rejects an operation. `code` names the rule, for example `editor_operation_layer_not_found`.'
      properties:
        code:
          type: string
          description: 'A stable error code.'
        message:
          type: string
          description: 'What went wrong and how to correct the operation. Do not branch on this text.'
      required:
        - code
        - message
    ValidationError:
      type: object
      description: 'A 422 validation error. `errors` maps each field to its messages.'
      properties:
        message:
          type: string
          description: 'The first message.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Messages per field, for example `errors.template_id`.'
      required:
        - message
        - errors
