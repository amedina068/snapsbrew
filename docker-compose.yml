# Self-host Snapsbrew with Docker Compose.
#
# The default stack is one container with SQLite. It needs no settings:
#
#   docker compose up -d --build
#   docker compose logs -f web
#
# The last log line is the URL to open. Open it and create the owner account.
# To show the setup URL again, run:
#   docker compose exec web php artisan snapsbrew:setup-url
#
# The "mysql" profile adds MySQL 8.4, Redis and Browserless. In that mode the
# web container runs Horizon instead of queue:work. To use it:
#   1. Copy .env.docker.example to .env.
#   2. Remove the comment marks of the MySQL block, and set the passwords.
#   3. Run: docker compose up -d --build
#
# docker-compose.image.yml is the same stack with the published image. When
# you change one file, change the other file too.

services:
  web:
    build: .
    image: snapsbrew:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # The app listens on the loopback interface of the host by default. Put a
      # reverse proxy on the host in front of it. Set APP_BIND=0.0.0.0 only if
      # the app must take traffic from other hosts with no proxy.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      # The database (SQLite), the app key, the uploads and the rendered images.
      - data:/data
    stop_grace_period: 60s
    depends_on:
      # These services exist only with the "mysql" profile. Without the
      # profile, the web container starts alone. `up` does not wait for MySQL
      # to be healthy: the web container waits up to 5 minutes for the
      # database (AUTORUN_LARAVEL_MIGRATION_TIMEOUT in the image).
      mysql:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
      browserless:
        condition: service_started
        required: false

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-snapsbrew}
      MYSQL_USER: ${DB_USERNAME:-snapsbrew}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      # The app uses MYSQL_USER. Nobody needs the root password.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    profiles: ["mysql"]
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pooled headless Chrome. The app posts the snap HTML to it and gets the
  # image back. The token is its only protection, so its port stays inside
  # the compose network.
  browserless:
    image: ghcr.io/browserless/chromium:v2.38.1
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-}
      CONCURRENT: 5
      QUEUED: 20
      # Milliseconds. Keep it equal to BROWSERLESS_TIMEOUT of the app.
      TIMEOUT: 15000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf \"http://localhost:3000/json/version?token=$${TOKEN}\" > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  data:
  mysql:
  redis:
